<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ukeplan · 3. trinn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow-school" id="eyebrowSchool"></p>
      <div class="week-nav" id="weekNav">
        <button class="week-nav-btn" id="prevWeekBtn" aria-label="Forrige uke">‹</button>
        <h1 id="weekTitle"></h1>
        <button class="week-nav-btn" id="nextWeekBtn" aria-label="Neste uke">›</button>
      </div>
      <p class="hero-sub" id="heroSub"></p>
    </div>
  </header>

  <div id="pinnedArea"></div>
  <div class="info-card">
    <ul id="infoList"></ul>
  </div>

  <h2>Ukas fokus</h2>
  <div class="grid-2">
    <div class="panel" id="focusPanel"></div>
  </div>

  <h2>Hjemmearbeid <span class="deadline-label" id="homeworkDeadline"></span></h2>
  <div class="panel" id="homeworkPanel"></div>

  <h2>Timeplan</h2>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="daySchedule"></div>

  <h2>Kroppsøving denne uken</h2>
  <div class="phys-ed-group" id="physEdGroup"></div>

  <h2>Kontakt</h2>
  <div class="contacts" id="contactsSection"></div>

  <footer id="footerText"></footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
